<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rateaura Technology — Invoicing</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-card">
    <div class="aura-ring"><span>RT</span></div>
    <h1>Rateaura Technology</h1>
    <p class="sub">Invoicing &amp; Accounts</p>
    <form id="login-form">
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit" class="btn-primary">Unlock</button>
      <div class="login-error" id="login-error"></div>
    </form>
    <div class="login-hint">First time here? Just set a password above — it will become your login for future visits.</div>
  </div>
</div>

<!-- APP SHELL -->
<div id="app">
  <div class="sidebar">
    <div class="brand">
      <div class="brand-word">Rateaura</div>
      <div class="brand-sub">Invoicing</div>
    </div>
    <div class="nav-item" data-view="dashboard" onclick="navigate('dashboard')"><span class="label">Dashboard</span></div>
    <div class="nav-item" data-view="invoices" onclick="navigate('invoices')"><span class="label">Invoices</span></div>
    <div class="nav-item" data-view="customers" onclick="navigate('customers')"><span class="label">Customers</span></div>
    <div class="nav-item" data-view="payables" onclick="navigate('payables')"><span class="label">Payables</span></div>
    <div class="nav-item" data-view="vendors" onclick="navigate('vendors')"><span class="label">Vendors</span></div>
    <div class="nav-item" data-view="settings" onclick="navigate('settings')"><span class="label">Company Settings</span></div>
    <div class="sidebar-footer">
      <button class="logout-btn" onclick="logout()">↩ <span class="label">Log out</span></button>
    </div>
  </div>
  <div class="main" id="main-content"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
